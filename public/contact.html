<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Méta-informations essentielles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu - Contact</title>
    <!-- Lien vers la feuille de styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête du site avec le titre principal et le menu de navigation -->
    <header>
        <div class="header-container">
            <!-- Logo du site -->
            <img src="https://placehold.co/150x50/1a3a6b/white?text=ACTU+LOGO" alt="Logo Actu" class="logo">

            <!-- Bouton hamburger pour mobile -->
            <button id="menu-btn" class="menu-hamburger">☰</button>

            <!-- Menu de navigation -->
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Accueil</a></li>
                    <li><a href="articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
            </nav>
        </div>
        <h2>L'actualité en continu</h2>
    </header>

    <!-- Section principale contenant le formulaire de contact -->
    <main>
        <!-- Conteneur principal avec largeur maximale -->
        <div class="content-wrapper">
            <!-- Titre principal -->
            <h1>Contactez-nous</h1>

            <!-- Formulaire de contact -->
            <!-- ATTENTION : Ce formulaire n'est pas encore fonctionnel.
                 Il sera connecté à un backend lors d'une prochaine étape. -->
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="contact-name">Nom</label>
                    <input type="text" id="contact-name" name="name" class="form-input" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" class="form-input" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" class="form-textarea" placeholder="Votre message..." rows="6" required></textarea>
                </div>

                <button type="submit" class="contact-submit">Envoyer</button>
            </form>
        </div>
    </main>

    <!-- Pied de footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
        <a href="articles.html" class="view-all-button">Retour aux actualités</a>
    </footer>

    <!-- Script JavaScript pour le menu hamburger -->
    <script src="script.js"></script>

</body>
</html>
