<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu Admin - Nouveau Article</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- En-tête du site -->
    <header>
        <div class="header-container">
            <img src="https://placehold.co/150x50/1a3a6b/white?text=ACTU+LOGO" alt="Logo Actu" class="logo">
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html" class="nav-link">Accueil</a></li>
                    <li><a href="../articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="../a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="../contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
        <h2>Tableau de bord administrateur</h2>
    </header>

    <!-- Formulaire de nouvel article -->
    <main>
        <div class="content-wrapper">
            <div class="article-form-container">
                <h1>Écrire un nouvel article</h1>

                <!-- Formulaire de publication -->
                <!-- Note: Ce formulaire envoie des données multipart/form-data pour les fichiers -->
                <form id="nouveau-article-form" class="contact-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="titre">Titre</label>
                        <input type="text" id="titre" name="titre" class="form-input" placeholder="Titre de l'article" required>
                    </div>

                    <div class="form-group">
                        <label for="contenu">Contenu</label>
                        <textarea id="contenu" name="contenu" class="form-textarea" placeholder="Écrivez votre article ici..." rows="8" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="image">Image (optionnel)</label>
                        <input type="file" id="image" name="image" class="form-input" accept="image/*">
                    </div>

                    <div class="form-actions" style="display: flex; gap: 10px; margin-top: 15px;">
                        <button type="submit" id="btn-publier" name="action" value="publie" class="contact-submit">Publier</button>
                        <button type="submit" id="btn-brouillon" name="action" value="brouillon" class="btn-admin" style="padding: 0.75rem 1.5rem; font-size: 1rem; background-color: #6c757d; border: none; border-radius: 6px; color: white; cursor: pointer;">Enregistrer en brouillon</button>
                    </div>
                </form>

                <p id="message-erreur" class="error-message" style="display: none;"></p>
                <p id="message-success" class="success-message" style="display: none; color: #28a745;"></p>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
    </footer>

    <script src="script-admin.js"></script>
    <script src="script-nouveau.js"></script>
</body>
</html>
