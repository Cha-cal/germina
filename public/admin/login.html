<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu Admin - Connexion</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- En-tête du site -->
    <header>
        <div class="header-container">
            <img src="https://placehold.co/150x50/1a3a6b/white?text=ACTU+LOGO" alt="Logo Actu" class="logo">
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html" class="nav-link">Accueil</a></li>
                    <li><a href="../articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="../a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="../contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
        <h2>Connexion administrateur</h2>
    </header>

    <!-- Formulaire de connexion -->
    <main>
        <div class="content-wrapper">
            <div class="login-container">
                <h1>Connexion</h1>
                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="admin@actu.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mot-de-passe">Mot de passe</label>
                        <input type="password" id="mot-de-passe" name="motDePasse" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="contact-submit">Se connecter</button>
                </form>

                <p id="erreur-message" class="error-message" style="display: none; color: #ff4444; margin-top: 1rem;"></p>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
    </footer>

    <script src="script-admin.js"></script>
</body>
</html>
