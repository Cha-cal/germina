<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu Admin - Tableau de bord</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- En-tête du site -->
    <header>
        <div class="header-container">
            <img src="/logo.svg" alt="Logo Actu" class="logo">
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html" class="nav-link">Accueil</a></li>
                    <li><a href="../articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="../a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="../contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenu du tableau de bord -->
    <main>
        <div class="content-wrapper dashboard-wrapper">
            <div class="dashboard-header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px;">
                <h1>Tableau de bord</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a href="messages.html" class="view-all-button" style="text-decoration: none; position: relative;">
                        📩 Boîte de réception
                        <span id="badge-messages" class="notification-badge" style="display: none;"></span>
                    </a>
                    <button onclick="seDeconnecter()" class="contact-submit" style="background-color: #dc3545;">Se déconnecter</button>
                </div>
            </div>

            <!-- Bloc 1 : Nouvelle publication -->
            <section class="dashboard-section">
                <h2>Nouvelle publication</h2>
                <div class="dashboard-actions">
                    <a href="nouveau.html" class="view-all-button btn-large">➕ Écrire un nouvel article</a>
                </div>
            </section>

            <!-- Bloc 2 : Mes Brouillons -->
            <section class="dashboard-section">
                <h2>Mes Brouillons</h2>
                <div id="liste-brouillons"></div>
            </section>

            <!-- Bloc 3 : Publications en ligne -->
            <section class="dashboard-section">
                <h2>Publications en ligne</h2>
                <div id="liste-publies"></div>
            </section>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
    </footer>

    <!-- Script pour la déconnexion -->
    <script src="script-admin.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
