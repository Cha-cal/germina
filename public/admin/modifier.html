<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu Admin - Modifier l'article</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- En-tête du site -->
    <header>
        <div class="header-container">
            <img src="/logo.svg" alt="Logo Actu" class="logo">
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html" class="nav-link">Accueil</a></li>
                    <li><a href="../articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="../a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="../contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Formulaire de modification d'article -->
    <main>
        <div class="content-wrapper">
            <div class="article-form-container">
                <h1>Modifier l'article</h1>

                <form id="modifier-article-form" class="contact-form" enctype="multipart/form-data">
                    <input type="hidden" id="article-id" name="id">

                    <div class="form-group">
                        <label for="titre">Titre</label>
                        <input type="text" id="titre" name="titre" class="form-input" placeholder="Titre de l'article" required>
                    </div>

                    <div class="form-group">
                        <label for="contenu">Contenu</label>
                        <textarea id="contenu" name="contenu" class="form-textarea" placeholder="Écrivez votre article ici..." rows="8" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="statut">Statut</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="statut-publie" name="statut" value="publie">
                            <label for="statut-publie">Publié (si décoché = Brouillon)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="image">Image (laisser vide pour conserver l'image actuelle)</label>
                        <input type="file" id="image" name="image" class="form-input" accept="image/*">
                    </div>

                    <div class="form-actions" style="display: flex; gap: 10px; margin-top: 15px;">
                        <button type="submit" class="contact-submit">Enregistrer les modifications</button>
                        <a href="dashboard.html" class="view-all-button" style="background-color: #6c757d; text-decoration: none;">Annuler</a>
                    </div>
                </form>

                <p id="message-erreur" class="error-message" style="display: none;"></p>
                <p id="message-success" class="success-message" style="display: none; color: #28a745;"></p>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
    </footer>

    <script src="script-admin.js"></script>
    <script src="script-modifier.js"></script>
</body>
</html>
