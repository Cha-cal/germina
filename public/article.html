<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu - Article détaillé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête du site avec le titre principal et le menu de navigation -->
    <header>
        <div class="header-container">
            <!-- Logo du site -->
            <img src="/logo.png" alt="Logo Actu" class="logo">

            <!-- Menu de navigation -->
            <button id="menu-btn" class="menu-hamburger">☰</button>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Accueil</a></li>
                    <li><a href="articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Section principale contenant l'article complet -->
    <main>
        <!-- Conteneur principal avec largeur maximale pour l'article -->
        <div class="article-container">
            <!-- Lien de retour vers la page précédente -->
            <div class="article-header">
                <a href="articles.html" class="back-link">← Retour aux actualités</a>
            </div>

            <!-- Titre principal de l'article (rempli dynamiquement) -->
            <h1 id="titre-article" class="article-title"></h1>

            <!-- Date de publication (remplie dynamiquement) -->
            <time id="date-article" class="article-date"></time>

            <!-- Grande image principale (remplie dynamiquement) -->
            <figure class="article-image-container">
                <img id="image-article" src="https://picsum.photos/800/400" alt="Image principale de l'article">
            </figure>

            <!-- Contenu long de l'article (rempli dynamiquement) -->
            <article id="contenu-article" class="article-content">
                <!-- Le contenu sera chargé dynamiquement par JavaScript -->
            </article>

            <!-- Section commentaires -->
            <section class="comments-section">
                <!-- Affiche les commentaires existants -->
                <div id="liste-commentaires"></div>

                <!-- Formulaire pour poster un commentaire -->
                <form id="form-commentaire" class="comment-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="nom-commentaire">Pseudo</label>
                        <input type="text" id="nom-commentaire" name="nom" class="form-input" placeholder="Votre pseudo" required>
                    </div>
                    <div class="form-group">
                        <label for="message-commentaire">Commentez</label>
                        <textarea id="message-commentaire" name="message" class="form-textarea" placeholder="Dites ce que vous pensez..." required></textarea>
                    </div>
                    <button type="submit" class="comment-submit">Publier</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Pied de footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
        <a href="articles.html" class="view-all-button">Retour aux actualités</a>
    </footer>

    <!-- Script JavaScript pour le menu hamburger et le chargement des articles -->
    <script src="script.js"></script>

</body>
</html>
