<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Méta-informations essentielles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actu - L'actualité en continu</title>
    <!-- Lien vers la feuille de styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête du site avec le titre principal et le menu de navigation -->
    <header>
        <div class="header-container">
            <!-- Logo du site -->
            <img src="https://placehold.co/150x50/1a3a6b/white?text=ACTU+LOGO" alt="Logo Actu" class="logo">

            <!-- Menu de navigation -->
            <button id="menu-btn" class="menu-hamburger">☰</button>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link active">Accueil</a></li>
                    <li><a href="articles.html" class="nav-link">Toutes les actus</a></li>
                    <li><a href="a-propos.html" class="nav-link">À propos</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
        <h2>L'actualité en continu</h2>
    </header>

    <!-- Section principale contenant les articles de news -->
    <main>
        <!-- Conteneur principal avec largeur maximale -->
        <div class="content-wrapper">
            <!-- Grille des cartes d'actualité (remplie dynamiquement par JavaScript) -->
            <section id="liste-articles" class="news-container">
                <p id="chargement">Chargement des actualités...</p>
            </section>
        </div>
    </main>

    <!-- Pied de page avec le bouton de navigation -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Actu - Tous droits réservés</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
            </div>
        </div>
        <a href="articles.html" class="view-all-button">Voir toutes les publications</a>
    </footer>

    <!-- Script JavaScript pour le menu hamburger -->
    <script src="script.js"></script>

</body>
</html>
